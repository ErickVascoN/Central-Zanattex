<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Zanattex">
  <title>Zanattex — símbolo</title>
  <!-- Selo quadrado (mesma construção do favicon), para avatar, carimbo ou
       marca d'água em documentos. -->
  <defs><clipPath id="zx-selo"><rect width="128" height="128" rx="28"/></clipPath></defs>
  <g clip-path="url(#zx-selo)">
    <rect width="128" height="128" fill="#172554"/>
    <rect width="128" height="16" fill="#dc2626"/>
    <text x="64" y="100" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="76" fill="#ffffff" text-anchor="middle">Z</text>
  </g>
</svg>
