{% extends "base.html" %}

{% block content %}
<div style="display:flex;flex-direction:column;gap:12px;">
    <!-- Barra de ações (o título "Calculadora de Frete" já está no topo do app) -->
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <p class="chart-s" style="margin:0;flex:1;min-width:180px;">Formação de preço de frete e registro de cálculos por cliente.</p>
        <button type="button" onclick="freteAnalytics()"
                style="border:none;background:var(--navy);color:#fff;border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;">
            📊 Dados &amp; Análises
        </button>
        <a href="{% url 'frete:calculadora_raw' %}" target="_blank"
           style="border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap;">
            Abrir em tela cheia ↗
        </a>
    </div>

    <!-- A calculadora roda isolada no iframe (Tailwind/Supabase próprios, sem
         conflitar com o CSS do app). Dentro do iframe o cabeçalho próprio dela
         some (classe "embedded"), pra não duplicar a marca do app. -->
    <div class="card" style="padding:0;overflow:hidden;">
        <iframe id="frete-frame" src="{% url 'frete:calculadora_raw' %}" title="Calculadora de Frete"
                style="width:100%;height:calc(100vh - 190px);min-height:560px;border:0;display:block;"></iframe>
    </div>
</div>

<script>
    // "Dados & Análises" mora dentro do iframe (mesma origem) — o botão do app
    // chama a função da calculadora diretamente.
    function freteAnalytics() {
        var win = document.getElementById("frete-frame").contentWindow;
        if (win && typeof win.openAnalytics === "function") {
            win.openAnalytics();
        }
    }
</script>
{% endblock %}
