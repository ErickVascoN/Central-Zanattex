{% extends "base.html" %}

{% block pagetitle %}Central de Dados{% endblock %}

{% block content %}
<div class="home-hero">
    <div class="home-mark">
        <span class="wm"><b>Z</b>ANATTE<b>X</b></span>
        <span class="tagline">Central de Dados</span>
    </div>
    <p class="home-hint">
        Bem-vindo, {{ user.get_full_name|default:user.get_username }} —
        selecione um setor no menu ao lado.
    </p>
</div>

<style>
    .home-hero {
        min-height: calc(100vh - 60px - 44px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 18px;
        user-select: none;
    }
    .home-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        opacity: .22;
        animation: home-fade 1.1s ease both;
    }
    .home-mark .wm {
        font-weight: 800;
        font-size: clamp(3rem, 12vw, 8rem);
        letter-spacing: .04em;
        line-height: 1;
        color: var(--navy);
    }
    .home-mark .wm b { color: var(--red); font-weight: 800; }
    .home-mark .tagline {
        font-size: clamp(.7rem, 1.6vw, 1rem);
        letter-spacing: .5em;
        text-transform: uppercase;
        color: var(--navy);
        padding-left: .5em;
    }
    .home-hint {
        font-size: 13px;
        color: var(--faint);
        margin: 0;
        animation: home-fade 1.1s ease .35s both;
    }
    @keyframes home-fade {
        from { opacity: 0; transform: translateY(8px); }
    }
    @media (prefers-reduced-motion: reduce) {
        .home-mark, .home-hint { animation: none; }
        .home-hint { opacity: 1; }
    }
</style>
{% endblock %}
