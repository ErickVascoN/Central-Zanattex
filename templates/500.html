<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erro interno · Zanattex</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Página 500: sem tag de arquivo estático nem context processors —
           Django renderiza esta com contexto vazio (o erro pode ter
           acontecido antes deles rodarem), então tudo aqui é inline. */
      :root {
        --navy: #172554;
        --navy-deep: #0f172a;
        --navy-soft: #1e3a8a;
        --red: #dc2626;
        --ink: #1e293b;
        --muted: #64748b;
        --bg: #f4f6fb;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Inter",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .err-wrap {
        max-width: 440px;
        text-align: center;
      }
      .err-code {
        font-size: 76px;
        font-weight: 800;
        color: var(--heading);
        line-height: 1;
        background: linear-gradient(180deg, var(--navy-deep), var(--navy-soft));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .err-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--ink);
        margin: 10px 0 6px;
      }
      .err-msg {
        font-size: 13.5px;
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 22px;
      }
      .err-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: none;
        background: var(--navy);
        color: #fff;
        border-radius: 9px;
        padding: 11px 20px;
        font-size: 13.5px;
        font-weight: 600;
        text-decoration: none;
      }
      .err-bar {
        width: 48px;
        height: 4px;
        background: var(--red);
        border-radius: 999px;
        margin: 0 auto 18px;
      }
    </style>
  </head>
  <body>
    <div class="err-wrap">
      <div class="err-bar"></div>
      <div class="err-code">500</div>
      <div class="err-title">Algo deu errado do nosso lado</div>
      <p class="err-msg">
        O erro já foi registrado. Tente de novo em alguns instantes — se
        persistir, contate-nos.
      </p>
      <a class="err-btn" href="/">← Voltar para a Central de Dados</a>
    </div>
  </body>
</html>
