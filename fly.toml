# Configuração do Fly.io — ver Fase 4 do plano de migração.
# `app` abaixo é um placeholder: o `fly launch` pede/gera o nome real na hora
# (precisa ser único globalmente) — ajuste aqui ou deixe o launch reescrever.
app = "central-zanattex"
primary_region = "gru"  # São Paulo — mesma região do Postgres, ver Fase 4 do plano

[build]

[env]
  DJANGO_DEBUG = "False"
  # Liga o agendador de sincronização em background dentro do processo do
  # gunicorn (ver integracao/apps.py) — sem isso as tabelas nunca seriam
  # atualizadas em produção.
  RUN_SCHEDULER = "1"
  # Gestão de OP (controle_op) — ligada em produção a partir do merge das
  # Fases 1-5 do mini-ERP da OP (Corte→Envio→Produção→Retorno→Balanço→Baixa).
  GESTAO_OP_HABILITADA = "True"
  # Base fixa dos links mandados pra fora do sistema (ex.: link do
  # prestador por WhatsApp, controle_op/views.py::disparo_prestadores) —
  # NUNCA tirar do host da requisição, senão quem testar local manda link
  # pra 127.0.0.1 pro prestador de verdade.
  SITE_URL = "https://central-zanattex.fly.dev"
  # Teto por sessão de importação de XML (fiscal/views.py::_gravar_e_indexar)
  # — batendo no padrão de 500 (achado do usuário: leva de notas grande
  # esbarrava nisso). Upload já vai em POSTs de até 250 arquivos e a
  # confirmação em lotes de 100 (ver memory/fly-proxy-60s-lotes.md), então
  # subir o teto só aumenta quantos lotes rodam, não o tamanho de cada um —
  # não deve travar pelo timeout do proxy.
  FISCAL_MAX_ARQUIVOS_POR_ENVIO = "3000"

[http_service]
  internal_port = 8000
  force_https = true
  # Importante: NÃO deixar o Fly suspender a máquina quando ocioso — o
  # agendador de sync precisa ficar rodando o tempo todo em background, não
  # só quando alguém está navegando no app.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
