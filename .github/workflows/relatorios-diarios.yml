name: Relatórios diários automáticos

# Dispara o endpoint protegido em relatorios/cron.py 3x por dia (~9h, 13h e
# 17h horário de Brasília — Brasil não tem mais horário de verão, então os
# horários em UTC abaixo são fixos). Uma chamada só cobre os dois relatórios
# (Corte + Produção Diária), mandados juntos no mesmo e-mail: o endpoint
# checa os dados de D-1 de cada um e só reenvia o que tiver novidade desde o
# último e-mail do dia (fica em silêncio se nada mudou); quando os dois
# completam, esse é o último e-mail do dia.
#
# Não acessa Sheets/Postgres direto — só chama a URL do app via curl com um
# token secreto. Configurar nos secrets do repositório:
#   - APP_URL: URL base do app em produção (ex.: https://central-zanattex.fly.dev)
#   - REPORT_TRIGGER_TOKEN: mesmo valor do `fly secrets set REPORT_TRIGGER_TOKEN=...`

on:
  schedule:
    - cron: "0 12 * * *"  # ~9h BRT
    - cron: "0 16 * * *"  # ~13h BRT
    - cron: "0 20 * * *"  # ~17h BRT
  workflow_dispatch: {}  # permite disparar manualmente pela aba Actions

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Corte + Produção Diária
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.REPORT_TRIGGER_TOKEN }}" \
            "${{ secrets.APP_URL }}/relatorios/cron/"
